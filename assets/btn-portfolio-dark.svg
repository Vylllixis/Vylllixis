<svg xmlns="http://www.w3.org/2000/svg" width="162" height="44" viewBox="0 0 162 44" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<style>
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes cyc{0%{opacity:0}2%{opacity:1}90%{opacity:1}94%,100%{opacity:0}}
@keyframes sweep{0%,100%{transform:rotate(-50deg)}50%{transform:rotate(40deg)}}
.f{animation:fade .9s ease-out both}
.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.65,0,.35,1) both}
.p{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.7,.2,1) both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.7,.2,1) both}
.bl{animation:blink 1.1s steps(1) infinite}
.pu{animation:pulse 2.6s ease-in-out infinite}
.cy{animation:cyc 18s linear infinite both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
